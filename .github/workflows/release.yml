name: Release Helm Chart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version to release (e.g., 0.1.0)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Update Chart version from tag
        run: |
          echo "Replacing placeholder with version: ${{ steps.version.outputs.VERSION }}"
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" Chart.yaml
          grep "^version:" Chart.yaml
          echo "✓ Chart.yaml updated (not committed - for packaging only)"

      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages
          helm package . -d .cr-release-packages
          # Copy index.html and CNAME to release packages for later use
          cp docs/index.html .cr-release-packages/
          cp docs/CNAME .cr-release-packages/

      - name: Checkout gh-pages
        run: |
          # Reset uncommitted changes (Chart.yaml was only modified for packaging)
          git reset --hard HEAD
          git fetch origin gh-pages
          git checkout gh-pages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: .cr-release-packages/*.tgz
          body: |
            ## Helm Chart Release ${{ steps.version.outputs.VERSION }}
            
            ### Installation
            
            ```bash
            helm repo add lissto https://helm.lissto.dev/charts
            helm repo update
            helm install lissto lissto/lissto --version ${{ steps.version.outputs.VERSION }} --namespace lissto-system --create-namespace
            ```
            
            ### What's Changed
            
            See [CHANGELOG.md](https://github.com/lissto-dev/lissto-helm/blob/main/CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update chart repository
        run: |
          # Create index directory if it doesn't exist
          mkdir -p charts
          
          # Copy existing index.yaml if it exists on gh-pages
          if [ -f charts/index.yaml ]; then
            cp charts/index.yaml charts/index.yaml.backup
          fi
          
          # Copy chart package temporarily to generate proper index
          cp .cr-release-packages/*.tgz charts/
          
          # Generate index, merging with existing if available
          if [ -f charts/index.yaml.backup ]; then
            helm repo index charts --url https://github.com/lissto-dev/lissto-helm/releases/download/${{ github.ref_name }} --merge charts/index.yaml.backup
          else
            helm repo index charts --url https://github.com/lissto-dev/lissto-helm/releases/download/${{ github.ref_name }}
          fi
          
          # Remove .tgz files - we'll serve from GitHub releases
          rm charts/*.tgz
          rm -f charts/index.yaml.backup
          
          # Copy index.html and CNAME from release packages
          cp .cr-release-packages/index.html index.html
          cp .cr-release-packages/CNAME CNAME

      - name: Commit and push to gh-pages
        run: |
          git add charts/index.yaml index.html CNAME
          git commit -m "Release chart version ${{ steps.version.outputs.VERSION }}" || echo "No changes to commit"
          git push origin gh-pages



