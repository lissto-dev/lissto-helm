{{- if .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lissto.fullname" . }}-api
  labels:
    {{- include "lissto.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "lissto.fullname" . }}-api
subjects:
- kind: ServiceAccount
  name: {{ include "lissto.fullname" . }}-api
  namespace: {{ include "lissto.namespace" . }}
{{- end }}

