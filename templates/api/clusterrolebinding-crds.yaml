{{- if .Values.api.enabled }}
# ClusterRoleBinding for dev namespace access
# This grants CRD access to ALL namespaces, but NOT secrets
# Secret access is restricted to the global namespace via Role/RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lissto.fullname" . }}-api-crds
  labels:
    {{- include "lissto.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "lissto.fullname" . }}-api-crds
subjects:
- kind: ServiceAccount
  name: {{ include "lissto.fullname" . }}-api
  namespace: {{ include "lissto.namespace" . }}
{{- end }}

