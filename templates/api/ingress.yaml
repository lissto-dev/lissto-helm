{{- if .Values.api.enabled }}
{{- $ingresses := dict }}
{{- if .Values.api.ingresses }}
  {{- $ingresses = .Values.api.ingresses }}
{{- else if .Values.api.ingress.enabled }}
  {{- $ingresses = dict "default" .Values.api.ingress }}
{{- end }}
{{- range $name, $ingress := $ingresses }}
{{- if $ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lissto.fullname" $ }}-api{{- if ne $name "default" }}-{{ $name }}{{- end }}
  namespace: {{ include "lissto.namespace" $ }}
  labels:
    {{- include "lissto.api.labels" $ | nindent 4 }}
    {{- if ne $name "default" }}
    app.kubernetes.io/ingress: {{ $name | quote }}
    {{- end }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ingress.className }}
  ingressClassName: {{ $ingress.className }}
  {{- end }}
  {{- if $ingress.tls }}
  tls:
    {{- range $ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "lissto.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
