{{- if and .Values.controller.enabled .Values.controller.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lissto.fullname" . }}-controller-manager
  labels:
    {{- include "lissto.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "lissto.fullname" . }}-controller-manager
subjects:
- kind: ServiceAccount
  name: {{ include "lissto.controller.serviceAccountName" . }}
  namespace: {{ include "lissto.namespace" . }}
{{- end }}

