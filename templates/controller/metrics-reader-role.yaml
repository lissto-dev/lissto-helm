{{- if and .Values.controller.enabled .Values.controller.rbac.create .Values.controller.metrics.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "lissto.fullname" . }}-metrics-reader
  labels:
    {{- include "lissto.controller.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
{{- end }}
